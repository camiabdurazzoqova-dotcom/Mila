body::before{content:"";position:fixed;inset:0;background:linear-gradient(#0d170acc,#0d170a55 40%,#0d170a99);z-index:0}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
main{position:relative;z-index:2;padding:28px 16px 70px;max-width:1100px;margin:auto;text-align:center}
h1{font:italic 500 clamp(2.2rem,7vw,4rem)/1.05 "Cormorant Garamond",Georgia,serif;margin:.2em 0 .1em;text-shadow:0 2px 18px #000}
.sub{opacity:.85;margin:0 0 6px}
.bar{margin:12px 0 26px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:7px 16px;backdrop-filter:blur(6px)}
button:hover,button:focus-visible{background:var(--leaf);color:#14200f;outline:none}
.scroll{overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
#tree{position:relative;display:flex;justify-content:center;width:max-content;min-width:100%;margin:auto;padding:0 16px 10px}
svg#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:grow 1.8s ease-out forwards;filter:drop-shadow(0 0 5px #f3e6a1aa)}
@keyframes grow{to{stroke-dashoffset:0}}
.branch{display:flex;flex-direction:column;align-items:center}
.kids{display:flex;gap:12px;justify-content:center;margin-top:56px;flex-wrap:nowrap}
.node{position:relative;width:132px;padding:14px 10px 12px;background:var(--glass);border:1px solid var(--line);border-radius:48% 48% 40% 40% / 38% 38% 30% 30%;backdrop-filter:blur(7px);box-shadow:0 10px 30px #0008;transition:transform .3s}
.node:hover{transform:translateY(-4px) rotate(-1deg)}
.av{width:62px;height:62px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,var(--sun),var(--leaf) 60%,#4f6b2a);color:var(--bark);box-shadow:0 0 18px #f3e6a199}
.name{font:700 1.25rem/1.1 "Cormorant Garamond",Georgia,serif;outline:none;min-height:1.2em}
.role{font-size:.78rem;opacity:.8;margin-top:2px}
.edit .name{border-bottom:1px dashed var(--sun)}
.ctl{display:none;gap:6px;justify-content:center;margin-top:8px}
.edit .ctl{display:flex}
.ctl button{padding:2px 9px;font-size:.8rem}
footer{margin-top:40px;opacity:.7;font-size:.85rem}

@media(prefers-reduced-motion:reduce){svg path{animation:none;stroke-dashoffset:0}canvas{display:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <h1>Bizning oila daraxtimiz</h1>
  <p class="sub">Ildizlarimiz — bobodan nevaragacha</p>
  <div class="bar"><button id="edit">✎ Tahrirlash</button> <button id="reset" hidden>Boshlang'ich holat</button></div>
  <div class="scroll"><div id="tree"><svg id="lines"></svg></div></div>
  <footer>Ismni bosib o'zgartiring · 🌱 tugma bilan farzand qo'shing</footer>
</main>
<script>
// Asosiy ma'lumot: ismlarni shu yerda ham o'zgartirish mumkin
const N=(name,kids=[],icon="🌿")=>({name,role:"",icon,kids});
const DEFAULT=N("Ko'chkinboy ota",[
 N("Abdumo'min Ko'chkinboyev",[
  N("Nodirabibi Mirzohidova (1-ayoli)",[
   N("Mo'minov Abdulla (1895–1978) va Shakirova Tojibibi (1900–1970)",[
    N("Abdumalik (pedagog)"),
    N("Inobat"),
    N("Mannop va Farida",[
     N("Feruza va Valijon",[
      N("Dilafruz",[N("Sharizoda"),N("Sabina"),N("Yasmina")]),
      N("Laziz va Laziza",[N("Aziza"),N("E'zoza"),N("Muhammadali")])]),
     N("Ma'ruf va Nargiza",[N("Javohir"),N("Jahongir"),N("Hasan"),N("Husan")]),
     N("Dilfuza va Zafar",[N("Komila"),N("Ziyoda")])])]),
   N("Emin"),
   N("Ulfat",[N("Tolqin"),N("Qamri")])],"🌸"),
  N("Toshbibi (2-ayoli)",[N("Karim"),N("Rahim"),N("Zebi"),N("Xadicha")],"🌸")
 ],"🍃")
],"🌳");
const KEY="family-tree-v3";
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data)data=JSON.parse(JSON.stringify(DEFAULT));
const icons=["🌱","🌿","🍀","🍃","🌸","🌼"];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const treeEl=document.getElementById("tree"),svg=document.getElementById("lines");
let editing=false;
function build(n,parent){
  const b=document.createElement("div");b.className="branch";
  const el=document.createElement("div");el.className="node";
  el.innerHTML='<div class="av"></div><div class="name"></div><div class="ctl"><button title="Farzand qo\u2019shish">🌱 +</button><button title="O\u2018chirish">✕</button></div>';
  el.querySelector(".av").textContent=n.icon||"🌱";
  const nm=el.querySelector(".name");nm.textContent=n.name;nm.contentEditable=editing;
  nm.addEventListener("input",()=>{n.name=nm.textContent;save()});
  nm.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();nm.blur()}});
  
  const [add,del]=el.querySelectorAll(".ctl button");
  add.onclick=()=>{n.kids.push({name:"Yangi ism",role:"Farzand",icon:icons[Math.floor(Math.random()*icons.length)],kids:[]});save();render()};
  del.onclick=()=>{if(!parent)return;parent.kids.splice(parent.kids.indexOf(n),1);save();render()};
  if(!parent)del.hidden=true;
  b.append(el);n._el=el;
  if(n.kids.length){const k=document.createElement("div");k.className="kids";n.kids.forEach(c=>k.append(build(c,n)));b.append(k)}
  return b;
}
function lines(){
  svg.innerHTML="";const base=treeEl.getBoundingClientRect();
  const pt=(el,top)=>{const r=el.getBoundingClientRect();return[r.left-base.left+r.width/2,(top?r.top:r.bottom)-base.top]};
  (function walk(n){n.kids.forEach(c=>{
    const[x1,y1]=pt(n._el,false),[x2,y2]=pt(c._el,true),m=(y1+y2)/2;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${x1} ${y1}C${x1} ${m},${x2} ${m},${x2} ${y2}`);
    p.style.setProperty("--len",Math.hypot(x2-x1,y2-y1)*1.4+40);svg.append(p);walk(c)})})(data);
}
function render(){
  [...treeEl.children].forEach(c=>{if(c!==svg)c.remove()});
  treeEl.append(build(data,null));treeEl.classList.toggle("edit",editing);
  requestAnimationFrame(lines);
}
document.getElementById("edit").onclick=e=>{editing=!editing;e.target.textContent=editing?"✓ Tayyor":"✎ Tahrirlash";document.getElementById("reset").hidden=!editing;render()};
document.getElementById("reset").onclick=()=>{if(confirm("Hammasi boshlang'ich holatga qaytadimi?")){data=JSON.parse(JSON.stringify(DEFAULT));save();render()}};
addEventListener("resize",lines);
render();
// Tirik o'tlar: uchib yuruvchi yorug' zarralar
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let W,H;
const fl=Array.from({length:38},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*2.2,s:.0002+Math.random()*.0004,p:Math.random()*6}));
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
(function tick(t){cx.clearRect(0,0,W,H);
 fl.forEach(f=>{f.y-=f.s;f.x+=Math.sin(t/2000+f.p)*.0003;if(f.y<-.02){f.y=1.02;f.x=Math.random()}
  const a=.35+.45*Math.sin(t/700+f.p);cx.beginPath();cx.fillStyle=`rgba(243,230,161,${a})`;cx.shadowColor="#f3e6a1";cx.shadowBlur=12;cx.arc(f.x*W,f.y*H,f.r,0,7);cx.fill()});
 requestAnimationFrame(tick)})(0);
</script>
</body>
</html>
